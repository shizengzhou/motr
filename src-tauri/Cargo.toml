[package]
name = "Motr"
version = "0.1.0"
description = "A full-featured download manager"
authors = ["shizeng"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [
    "tray-icon",
    "image-png",
    "devtools",
] }
tauri-plugin-log = "2"
trash = "5.2.9"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# deep-link feature：第二实例带 `magnet:...` 参数启动时，插件会先把参数转给
# deep-link 插件（见 src/protocol.rs 的 handle_urls）
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 「下载协议」：注册成 magnet: / thunder: / mo: / motrix: 的默认客户端
#（见 src/protocol.rs）。url 用来解析 mo:// 的 host 与参数（deep-link 插件
# 本来就依赖它，不新增编译量）
tauri-plugin-deep-link = "2.6.1"
url = "2"
# 「启用 UPnP」：给 BT / DHT 监听端口做路由器端口映射（UPnP IGD，见 src/upnp.rs）
igd-next = { version = "0.18.0", features = ["aio_tokio"] }
# 续租用的 tokio::time::sleep。tauri 自己的运行时就是 tokio，不新增编译量
tokio = { version = "1", features = ["time"] }
# 「有下载时不休眠」（对应原项目 EnergyManager 的 powerSaveBlocker）：
# macOS IOPMAssertion / Windows SetThreadExecutionState / Linux D-Bus inhibit
keepawake = "0.6"
