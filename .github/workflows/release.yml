# 打包并发布 Motr 到 GitHub Releases
#
# 触发方式：
#   1. push 版本标签：git tag v0.1.0 && git push origin v0.1.0
#   2. Actions 页面手动运行（tag 留空时使用 tauri.conf.json 里的版本号）
#
# 仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           必填，更新包签名私钥（pnpm tauri signer generate -w ~/.tauri/motr.key 生成）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（生成时留空则不配）
#
#   macOS 代码签名（可选）：
#   APPLE_CERTIFICATE                   Developer ID Application 证书 .p12 的 base64
#   APPLE_CERTIFICATE_PASSWORD          导出 .p12 时设置的密码
#   APPLE_SIGNING_IDENTITY              如 "Developer ID Application: Name (TEAMID)"
#
#   macOS 公证（可选，走 App Store Connect API Key）：
#   APPLE_API_ISSUER                    Issuer ID（Users and Access → Integrations）
#   APPLE_API_KEY                       Key ID
#   APPLE_API_KEY_CONTENT               AuthKey_XXXX.p8 的内容，原文或 base64 均可
#
# 产物会同时生成自动更新所需的 latest.json 与 .sig 文件，
# 与 tauri.conf.json 里 updater.endpoints 指向的 releases/latest/download/latest.json 对应。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，如 v0.1.0（留空则取 tauri.conf.json 中的版本）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 目前是 Apple Silicon 镜像；Intel 用 macos-15-intel。
          # 如果该标签不可用，可改为在 macos-latest 上执行
          # `--target universal-apple-darwin` 打通用包，但需要先 lipo 出
          # binaries/aria2c-universal-apple-darwin。
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # Linux ARM 必须用原生 ARM runner 构建：linuxdeploy 不支持交叉编译
          # aarch64 AppImage。sidecar 使用 binaries/aria2c-aarch64-unknown-linux-gnu。
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
          - name: Linux (arm64)
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles appimage,deb
          - name: Windows (x86_64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - uses: actions/checkout@v7

      - name: 解析发布版本
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 同步版本号到前端与 Tauri 配置
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.ver.outputs.version }}';
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            console.log('版本已设置为', version);
          "

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: 安装 Linux 打包依赖
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            file

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 准备 App Store Connect API Key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::warning::未配置 APPLE_API_KEY_CONTENT，跳过公证"
            exit 0
          fi
          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          KEY_FILE="$KEY_DIR/AuthKey.p8"
          mkdir -p "$KEY_DIR"

          # secret 支持两种写法：.p8 原文（PEM）或它的 base64，自动识别。
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$KEY_FILE"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            tr -d '\r\n' < "$KEY_FILE" | openssl base64 -d -A > "$KEY_DIR/AuthKey.decoded.p8"
            mv "$KEY_DIR/AuthKey.decoded.p8" "$KEY_FILE"
          fi

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::APPLE_API_KEY_CONTENT 既不是 .p8 原文也不是有效的 base64"
            exit 1
          fi
          chmod 600 "$KEY_FILE"
          echo "APPLE_API_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: 无签名私钥时关闭更新包产物
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次不会生成 latest.json / .sig，自动更新将不可用"
            node -e "
              const fs = require('fs');
              const file = 'src-tauri/tauri.conf.json';
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            "
          fi

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 自动更新签名
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS 公证：App Store Connect API Key
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Motr ${{ steps.ver.outputs.tag }}
          releaseBody: |
            ## 安装包

            | 平台 | 文件 |
            | --- | --- |
            | macOS（Apple 芯片） | `Motr_*_aarch64.dmg` |
            | macOS（Intel） | `Motr_*_x64.dmg` |
            | Windows（x64） | `Motr_*_x64-setup.exe` |
            | Linux（x64） | `Motr_*_amd64.AppImage` / `.deb` |
            | Linux（arm64） | `Motr_*_aarch64.AppImage` / `.deb` |

            macOS 若提示「已损坏」或「无法验证开发者」，可执行：
            `xattr -dr com.apple.quarantine /Applications/Motr.app`

            应用会通过 `latest.json` 自动检查更新。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
